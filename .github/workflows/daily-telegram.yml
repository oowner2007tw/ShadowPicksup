name: Daily Taiwan Stock Tier Telegram

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Taipei
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-taiwan-stock-tier
  cancel-in-progress: false

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout report logic
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch rankings and send Telegram report
        run: python analyze_twse_momentum.py
