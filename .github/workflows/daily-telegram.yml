name: Daily Taiwan Stock Tier Telegram

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Taipei
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-taiwan-stock-tier
  cancel-in-progress: false

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_RESEARCH_MODEL: gemini-3.5-flash-lite
    steps:
      - name: Checkout report logic
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh rankings
        run: python analyze_twse_momentum.py --no-telegram

      - name: Research new or stale product hypotheses
        id: research
        run: python research_product_mapping.py --limit 0
        # An unavailable research provider must not suppress the daily ranking report.
        # The final step still marks the run failed so the cause is visible.
        continue-on-error: true

      - name: Refresh report and send Telegram
        if: always()
        run: python analyze_twse_momentum.py

      - name: Save refreshed research data
        if: always()
        run: |
          git config user.name "ShadowPicksup Research Bot"
          git config user.email "shadowpicksup-bot@users.noreply.github.com"
          git add data/product-inference-review.json data/history report.json public/report.json app/report-data.ts
          git diff --cached --quiet || git commit -m "Refresh daily momentum research"
          git push

      - name: Surface unavailable product research
        if: always() && steps.research.outcome != 'success'
        run: |
          echo "Product research did not complete; prior hypotheses were retained. Check the research step for the API failure reason."
          exit 1
