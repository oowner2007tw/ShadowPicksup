name: Daily Taiwan Stock Tier Telegram

on:
  schedule:
    # 00:00 UTC = 08:00 Asia/Taipei
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-taiwan-stock-tier
  cancel-in-progress: false

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout report logic
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh rankings
        run: python analyze_twse_momentum.py --no-telegram

      - name: Research new or stale product hypotheses
        run: python research_product_mapping.py --limit 6

      - name: Refresh report and send Telegram
        run: python analyze_twse_momentum.py

      - name: Save refreshed research data
        run: |
          git config user.name "ShadowPicksup Research Bot"
          git config user.email "shadowpicksup-bot@users.noreply.github.com"
          git add data/product-inference-review.json data/history report.json public/report.json app/report-data.ts
          git diff --cached --quiet || git commit -m "Refresh daily momentum research"
          git push
