name: Bootstrap Product Theme Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-product-research
  cancel-in-progress: false

jobs:
  research-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_RESEARCH_MODEL: gemini-2.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research next baseline batch
        run: python research_product_mapping.py --bootstrap --limit 0
      - name: Commit research hypotheses
        if: always()
        run: |
          git config user.name "ShadowPicksup Research Bot"
          git config user.email "shadowpicksup-bot@users.noreply.github.com"
          git add data/product-inference-review.json
          git diff --cached --quiet || git commit -m "Add baseline product research"
          git push
